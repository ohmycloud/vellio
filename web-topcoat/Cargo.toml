[package]
name = "vellio-web-topcoat"
version = "0.1.0"
edition = "2024"

[dependencies]
easyread-gpui = { path = ".." }
ammonia = "4"
topcoat = { version = "=0.10.0", features = ["multipart", "anyhow"] }
anyhow = "1"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
roxmltree = "0.21"

[profile.dev]
debug = 0
